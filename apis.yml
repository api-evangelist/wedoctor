aid: wedoctor
name: WeDoctor
description: >-
  WeDoctor (微医, formerly Guahao.com / 挂号网) is a Hangzhou-based Chinese digital
  health platform founded in 2010 by Liao Jieyuan. It began as an online
  hospital-appointment registration network and grew into a full-stack "Internet +
  Healthcare" operator spanning online consultation and internet hospitals (it
  launched China's first, the Wuzhen Internet Hospital, in 2015), e-prescription
  and pharmacy fulfilment, screening and diagnostics, chronic-disease management,
  medical insurance settlement, and the WeDoctor Cloud platform sold to hospitals
  and regional health authorities. The company reports connections to thousands of
  Chinese hospitals and hundreds of thousands of registered physicians. Its public
  surface is consumer- and clinician-facing (web portal plus the 微医 patient app and
  微医生 doctor app); as of this profile it operates no public developer program,
  publishes no machine-readable API contract, and exposes no documented partner API
  — hospital and insurer integrations are handled through private commercial
  agreements rather than a self-serve developer portal.
