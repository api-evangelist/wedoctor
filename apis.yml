  detail: >-
    WeDoctor ships only end-user software — the 微医 patient app, the 微医生 clinician app and the
    wedoctor.com internet-hospital portal — and operates no developer program of any kind: the
    readable apex host wedoctor.com returns a genuine HTTP 404 for every OpenAPI, GraphQL,
    llms.txt, agent-card and /.well-known discovery path, and no open.*/developer.*/api.*
    subdomain exists (the 200s on those names are a *.wedoctor.com wildcard answering a Tencent
    EdgeOne bot challenge, proven by a negative-control hostname returning the identical body).
